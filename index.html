
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator WD Otomatis</title>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: 'Segoe UI', Arial, sans-serif;

  background-color: #0f172a;
  background-image: url("https://mariterbang.io/download/Aj4nk9t1.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  color: #f8fafc;
}



.container {
  width: 95%;
  max-width: 1200px;
  margin: 20px auto;
  padding: 30px;

  background: rgba(17, 29, 49, 0.94);

  border: 2px solid #3b82f6;
  border-radius: 22px;

  box-shadow:
    0 0 12px #3b82f655,
    0 0 30px #2563eb33,
    0 20px 60px #0008;

  backdrop-filter: blur(15px);

  animation: frameGlow 4s ease-in-out infinite;
  transition: .3s ease;
}

@keyframes frameGlow {
  0%, 100% {
    border-color: #2563eb;
    box-shadow: 0 0 15px #2563eb55, 0 20px 50px #0008;
  }

  50% {
    border-color: #8b5cf6;
    box-shadow: 0 0 25px #8b5cf688, 0 20px 60px #0008;
  }
}


h2 {
  text-align: center;
  font-size: 27px;
  letter-spacing: 1px;
  margin: 5px 0 25px;
  color: #60a5fa;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 18px 0 10px;
  color: #cbd5e1;
}


textarea {
  width: 100%;
  min-height: 350px;
  height: 350px;
  padding: 15px;
  resize: vertical;
  background: #0b1424;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 12px;
  font-family: monospace;
  font-size: 13px;
  line-height: 1.6;
  outline: none;
}

textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px #3b82f633;
}


textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px #3b82f633;
}

.row {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

button {
  border: none;
  padding: 15px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
}

button:active {
  transform: scale(.98);
}

.plus {
  flex: 1;
  color: white;
  background: linear-gradient(135deg,#2563eb,#1d4ed8);
}


.excel {
  width: 100%;
  margin-top: 22px;
  padding: 17px;

  color: white;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1.5px;

  background: linear-gradient(
    120deg,
    #1d4ed8,
    #3b82f6,
    #6366f1,
    #1d4ed8
  );

  background-size: 300% 300%;
  border: 1px solid #60a5fa;
  border-radius: 13px;

  box-shadow: 0 0 15px #2563eb66;

  animation: buttonLight 4s ease infinite;
}

.nominal {
  width: 100%;
  margin-top: 13px;
  padding: 17px;

  color: white;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1.5px;

  background: linear-gradient(
    120deg,
    #047857,
    #10b981,
    #34d399,
    #047857
  );

  background-size: 300% 300%;
  border: 1px solid #34d399;
  border-radius: 13px;

  box-shadow: 0 0 15px #10b98166;

  animation: buttonLight 4s ease infinite;
}

@keyframes buttonLight {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

.excel:hover,
.nominal:hover {
  transform: translateY(-3px) scale(1.01);
  filter: brightness(1.2);
}

.excel:active,
.nominal:active {
  transform: scale(.97);
}

.reset {
  width: 100%;
  margin-top: 12px;
  color: white;
  background: #475569;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px;
  margin-top: 12px;
  background: #0f1b2d;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #f8fafc;
}

.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
  margin: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  background: #475569;
  border-radius: 30px;
  transition: .3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

.switch input:checked + .slider {
  background: #10b981;
}

.switch input:checked + .slider:before {
  transform: translateX(24px);
}

#status {
  text-align: center;
  color: #4ade80;
  font-size: 13px;
  margin-top: 18px;
  min-height: 20px;
}

.info {
  color: #94a3b8;
  font-size: 12px;
  line-height: 1.8;
  margin-top: 18px;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 18px;
    margin: 10px auto;
  }

  h2 {
    font-size: 22px;
  }
}

  /* Background gambar + efek modern */
body {
  background-color: #0b1120;

  background-image:
    linear-gradient(
      rgba(10, 15, 30, 0.35),
      rgba(10, 15, 30, 0.35)
    ),
    url("https://mariterbang.io/download/Aj4nk9t1.jpg");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}


/* Container dengan efek glow */
.container {
  transition: .3s ease;
  animation: muncul .7s ease;
}

.container:hover {
  box-shadow: 0 20px 60px #2563eb30;
  border-color: #3b82f680;
}

/* Animasi masuk */
@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Kotak data lebih modern */
textarea {
  transition: .25s ease;
  box-shadow: inset 0 2px 8px #0004;
}

textarea:focus {
  background: #111e33;
  transform: scale(1.005);
}

/* Tombol lebih interaktif */
button {
  position: relative;
  overflow: hidden;
  transition: all .25s ease;
  box-shadow: 0 4px 12px #0003;
}

button:hover {
  filter: brightness(1.18);
  transform: translateY(-3px);
  box-shadow: 0 8px 20px #2563eb35;
}

button:active {
  transform: scale(.97);
}

/* Toggle lebih halus */
.slider {
  box-shadow: 0 2px 8px #0004;
}

/* Status animasi */
#status {
  animation: muncul .3s ease;
  font-weight: 600;
}

/* Sudut dan border lebih lembut */
.toggle-row {
  transition: .25s ease;
}

.toggle-row:hover {
  border-color: #60a5fa;
  background: #172b46;
}

/* Responsif HP */
@media (max-width: 600px) {
  .container {
    width: 100%;
    padding: 17px;
    margin: 5px auto;
  }

  button {
    font-size: 13px;
  }
}

  
.warning-text {
  margin-top: 25px;
  padding: 15px 10px;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;

  background: linear-gradient(
    90deg,
    #38bdf8,
    #a78bfa,
    #34d399,
    #facc15,
    #38bdf8
  );

  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  animation: warnaBerjalan 5s linear infinite,
             teksHidup 2s ease-in-out infinite;
}

@keyframes warnaBerjalan {
  to {
    background-position: 300% center;
  }
}

@keyframes teksHidup {
  0%, 100% {
    transform: scale(1);
    opacity: .8;
  }
  50% {
    transform: scale(1.025);
    opacity: 1;
  }
}

  .excel,
.nominal {
  text-shadow: 0 2px 5px rgba(0,0,0,.4);
}
  
</style>
</head>

<body>

<div class="container">

<h2>GENERATOR WD OTOMATIS</h2>

<label>Masukkan Data WD:</label>

<textarea id="data" placeholder="Paste data WD di sini..."></textarea>

<label>Pengaturan Tambahan Nominal</label>

<div class="toggle-row">
  <span>ADM 2.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle2500">
    <span class="slider"></span>
  </label>
</div>

<div class="toggle-row">
 <span>ADM 6.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle6500">
    <span class="slider"></span>
  </label>
</div>

<button class="excel" onclick="copyExcel()">
  COPY EXCEL (NAMA + USER ID)
</button>

<button class="nominal" onclick="copyNominal()">
  COPY NOMINAL
</button>
  
<div id="status"></div>


<div class="warning-text">
  ⚡ JANGAN TERBURU-BURU, SANTAI SAJA TAPI PASTI.
  DAN INGAT YA, JANGAN MAU MISTAKE KARENA SALAH COPY.
  ITU NAMANYA MISTAKE TOLOL! ⚡
</div>v>


</div>

<script>

const input = document.getElementById("data");
const statusBox = document.getElementById("status");
let tambahanNominal = 0;

const toggle2500 = document.getElementById("toggle2500");
const toggle6500 = document.getElementById("toggle6500");

toggle2500.addEventListener("change", function() {
  if (this.checked) {
    toggle6500.checked = false;
    tambahanNominal = 2500;
  } else {
    tambahanNominal = 0;
  }
});

toggle6500.addEventListener("change", function() {
  if (this.checked) {
    toggle2500.checked = false;
    tambahanNominal = 6500;
  } else {
    tambahanNominal = 0;
  }
});
  
// Format angka
function formatAngka(angka) {
  return Math.round(angka).toLocaleString("en-US");
}

// Membaca data transaksi WD
function bacaData() {
  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const kolom = lines[i].split("\t");

      hasil.push({
        index: i,
        nominalIndex: 3,
        nominal: Number(
          (kolom[3] || "").replace(/,/g, "").trim()
        )
      });
    }
  }

  return hasil;
}

// Tambah nominal semua transaksi
function tambah(jumlah) {
  tambahanNominal += jumlah;

  statusBox.textContent =
    "Tambahan nominal aktif: " +
    formatAngka(tambahanNominal);
}

// Copy Excel: Nama rekening kolom A, User ID kolom B
function copyExcel() {

  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const userID = (lines[i - 1] || "").trim();

      let rekening = "";

      for (let j = i + 1; j < lines.length; j++) {
        if (lines[j].startsWith("Withdraw\t")) break;

        if (/^[^\t,\n]+,\s*[^,\n]+,\s*.+$/.test(lines[j].trim())) {
          rekening = lines[j].trim();
          break;
        }
      }

      if (userID && rekening) {
        const bagian = rekening.split(",");
        const nama = bagian.slice(2).join(",").trim();

        if (nama) {
          hasil.push(nama + "\t" + userID);
        }
      }
    }
  }

  salin(hasil.join("\n"), "Data Excel berhasil disalin!");
}


function copyNominal() {
  const transaksi = bacaData();

  const hasil = transaksi
    .filter(x => Number.isFinite(x.nominal))
    .map(x => "-" + formatAngka(x.nominal + tambahanNominal));

  salin(
    hasil.join("\n"),
    "Nominal berhasil disalin!"
  );
}


async function salin(teks, pesan) {

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(teks);
    } else {
      const area = document.createElement("textarea");
      area.value = teks;
      document.body.appendChild(area);
      area.select();
      const berhasil = document.execCommand("copy");
      area.remove();

      if (!berhasil) throw new Error("Copy gagal");
    }

    statusBox.textContent = pesan;

  } catch (error) {
    statusBox.textContent = "Gagal menyalin. Coba gunakan browser Chrome.";
  }
}

  
</script>

</body>
</html>
