
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator WD Otomatis</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  padding: 20px;
  margin: 0;
}

.container {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #00000012;
}

h2 {
  text-align: center;
  color: #222;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 8px;
}

textarea {
  width: 100%;
  min-height: 300px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  font-family: monospace;
}

button {
  border: none;
  padding: 13px;
  border-radius: 7px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

button:active {
  transform: scale(.98);
}

.row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.row button {
  flex: 1;
}

.plus {
  background: #167d45;
}

.excel {
  background: #1769aa;
  width: 100%;
  margin-top: 18px;
}

.nominal {
  background: #159653;
  width: 100%;
  margin-top: 10px;
}

.reset {
  background: #777;
  width: 100%;
  margin-top: 10px;
}

.info {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
  margin-top: 12px;
}

#status {
  text-align: center;
  font-size: 13px;
  color: #168044;
  margin-top: 12px;
  min-height: 18px;
}
  .toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  background: #f3f5f7;
  border-radius: 9px;
  margin-top: 10px;
  font-weight: bold;
}

.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
  margin: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: #aaa;
  border-radius: 30px;
  transition: .3s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

.switch input:checked + .slider {
  background: #16a05d;
}

.switch input:checked + .slider:before {
  transform: translateX(24px);
}
</style>
</head>

<body>

<div class="container">

<h2>GENERATOR WD OTOMATIS</h2>

<label>Masukkan Data WD:</label>

<textarea id="data" placeholder="Paste data WD di sini..."></textarea>

<label>Pengaturan Tambahan Nominal</label>

<div class="toggle-row">
  <span>Tambahan 2.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle2500">
    <span class="slider"></span>
  </label>
</div>

<div class="toggle-row">
  <span>Tambahan 6.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle6500">
    <span class="slider"></span>
  </label>
</div>

<button class="excel" onclick="copyExcel()">
  COPY EXCEL (NAMA + USER ID)
</button>

<button class="nominal" onclick="copyNominal()">
  COPY NOMINAL
</button>

<button class="reset" onclick="resetData()">
  RESET DATA
</button>

<div id="status"></div>

<div class="info">
  Copy Excel: Nama rekening kolom A, User ID kolom B.<br>
  Copy Nominal: Semua nominal WD disalin satu per baris.<br>
  Tombol tambah nominal berlaku untuk semua transaksi Withdraw.
</div>

</div>

<script>

const input = document.getElementById("data");
const statusBox = document.getElementById("status");
let tambahanNominal = 0;
let tambahan2500 = false;
let tambahan6500 = false;
  
// Format angka
function formatAngka(angka) {
  return Math.round(angka).toLocaleString("en-US");
}

// Membaca data transaksi WD
function bacaData() {
  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const kolom = lines[i].split("\t");

      hasil.push({
        index: i,
        nominalIndex: 3,
        nominal: Number(
          (kolom[3] || "").replace(/,/g, "").trim()
        )
      });
    }
  }

  return hasil;
}

// Tambah nominal semua transaksi
function tambah(jumlah) {
  tambahanNominal += jumlah;

  statusBox.textContent =
    "Tambahan nominal aktif: " +
    formatAngka(tambahanNominal);
}

// Copy Excel: Nama rekening kolom A, User ID kolom B
function copyExcel() {

  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const userID = (lines[i - 1] || "").trim();

      let rekening = "";

      for (let j = i + 1; j < lines.length; j++) {
        if (lines[j].startsWith("Withdraw\t")) break;

        if (/^[^\t,\n]+,\s*[^,\n]+,\s*.+$/.test(lines[j].trim())) {
          rekening = lines[j].trim();
          break;
        }
      }

      if (userID && rekening) {
        const bagian = rekening.split(",");
        const nama = bagian.slice(2).join(",").trim();

        if (nama) {
          hasil.push(nama + "\t" + userID);
        }
      }
    }
  }

  salin(hasil.join("\n"), "Data Excel berhasil disalin!");
}

function copyNominal() {
  const transaksi = bacaData();

  const tambahan =
    (tambahan2500 ? 2500 : 0) +
    (tambahan6500 ? 6500 : 0);

  const hasil = transaksi
    .filter(x => Number.isFinite(x.nominal))
    .map(x => formatAngka(x.nominal + tambahan));

  salin(
    hasil.join("\n"),
    "Nominal berhasil disalin!"
  );
}

async function salin(teks, pesan) {

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(teks);
    } else {
      const area = document.createElement("textarea");
      area.value = teks;
      document.body.appendChild(area);
      area.select();
      const berhasil = document.execCommand("copy");
      area.remove();

      if (!berhasil) throw new Error("Copy gagal");
    }

    statusBox.textContent = pesan;

  } catch (error) {
    statusBox.textContent = "Gagal menyalin. Coba gunakan browser Chrome.";
  }
}

function resetData() {
  if (confirm("Yakin ingin menghapus semua data dan tambahan nominal?")) {
    input.value = "";
    tambahanNominal = 0;
    statusBox.textContent = "Data dan tambahan nominal berhasil direset.";
  }
}

  document.getElementById("toggle2500")
.addEventListener("change", function() {
  tambahan2500 = this.checked;
});

document.getElementById("toggle6500")
.addEventListener("change", function() {
  tambahan6500 = this.checked;
});
  
</script>

</body>
</html>
