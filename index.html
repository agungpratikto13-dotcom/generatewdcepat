
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator WD Otomatis</title>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0f172a;
  color: #f8fafc;
}

.container {
  max-width: 720px;
  margin: 30px auto;
  padding: 28px;
  background: #172338;
  border: 1px solid #29374d;
  border-radius: 20px;
  box-shadow: 0 15px 45px #0005;
}

h2 {
  text-align: center;
  font-size: 27px;
  letter-spacing: 1px;
  margin: 5px 0 25px;
  color: #60a5fa;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 18px 0 10px;
  color: #cbd5e1;
}


textarea {
  width: 100%;
  min-height: 450px;
  height: 450px;
  padding: 20px;
  resize: vertical;
  background: #0b1424;
  color: #e2e8f0;
  border: 1px solid #334155;
  border-radius: 12px;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.8;
  outline: none;
  transition: .2s;
}

textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px #3b82f633;
}


textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px #3b82f633;
}

.row {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

button {
  border: none;
  padding: 15px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
}

button:active {
  transform: scale(.98);
}

.plus {
  flex: 1;
  color: white;
  background: linear-gradient(135deg,#2563eb,#1d4ed8);
}

.excel {
  width: 100%;
  margin-top: 22px;
  color: white;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
}

.nominal {
  width: 100%;
  margin-top: 12px;
  color: white;
  background: linear-gradient(135deg,#10b981,#059669);
}

.reset {
  width: 100%;
  margin-top: 12px;
  color: white;
  background: #475569;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px;
  margin-top: 12px;
  background: #0f1b2d;
  border: 1px solid #334155;
  border-radius: 12px;
  color: #f8fafc;
}

.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
  margin: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  background: #475569;
  border-radius: 30px;
  transition: .3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

.switch input:checked + .slider {
  background: #10b981;
}

.switch input:checked + .slider:before {
  transform: translateX(24px);
}

#status {
  text-align: center;
  color: #4ade80;
  font-size: 13px;
  margin-top: 18px;
  min-height: 20px;
}

.info {
  color: #94a3b8;
  font-size: 12px;
  line-height: 1.8;
  margin-top: 18px;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 18px;
    margin: 10px auto;
  }

  h2 {
    font-size: 22px;
  }
}

</style>
</head>

<body>

<div class="container">

<h2>GENERATOR WD OTOMATIS</h2>

<label>Masukkan Data WD:</label>

<textarea id="data" placeholder="Paste data WD di sini..."></textarea>

<label>Pengaturan Tambahan Nominal</label>

<div class="toggle-row">
  <span>Tambahan 2.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle2500">
    <span class="slider"></span>
  </label>
</div>

<div class="toggle-row">
  <span>Tambahan 6.500</span>
  <label class="switch">
    <input type="checkbox" id="toggle6500">
    <span class="slider"></span>
  </label>
</div>

<button class="excel" onclick="copyExcel()">
  COPY EXCEL (NAMA + USER ID)
</button>

<button class="nominal" onclick="copyNominal()">
  COPY NOMINAL
</button>

<button class="reset" onclick="resetData()">
  RESET DATA
</button>

<div id="status"></div>

<div class="info">
  Copy Excel: Nama rekening kolom A, User ID kolom B.<br>
  Copy Nominal: Semua nominal WD disalin satu per baris.<br>
  Tombol tambah nominal berlaku untuk semua transaksi Withdraw.
</div>

</div>

<script>

const input = document.getElementById("data");
const statusBox = document.getElementById("status");
let tambahanNominal = 0;
let tambahanNominal = 0;

const toggle2500 = document.getElementById("toggle2500");
const toggle6500 = document.getElementById("toggle6500");

toggle2500.addEventListener("change", function() {
  if (this.checked) {
    toggle6500.checked = false;
    tambahanNominal = 2500;
  } else {
    tambahanNominal = 0;
  }
});

toggle6500.addEventListener("change", function() {
  if (this.checked) {
    toggle2500.checked = false;
    tambahanNominal = 6500;
  } else {
    tambahanNominal = 0;
  }
});
  
// Format angka
function formatAngka(angka) {
  return Math.round(angka).toLocaleString("en-US");
}

// Membaca data transaksi WD
function bacaData() {
  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const kolom = lines[i].split("\t");

      hasil.push({
        index: i,
        nominalIndex: 3,
        nominal: Number(
          (kolom[3] || "").replace(/,/g, "").trim()
        )
      });
    }
  }

  return hasil;
}

// Tambah nominal semua transaksi
function tambah(jumlah) {
  tambahanNominal += jumlah;

  statusBox.textContent =
    "Tambahan nominal aktif: " +
    formatAngka(tambahanNominal);
}

// Copy Excel: Nama rekening kolom A, User ID kolom B
function copyExcel() {

  const lines = input.value.split(/\r?\n/);
  const hasil = [];

  for (let i = 0; i < lines.length; i++) {

    if (lines[i].startsWith("Withdraw\t")) {

      const userID = (lines[i - 1] || "").trim();

      let rekening = "";

      for (let j = i + 1; j < lines.length; j++) {
        if (lines[j].startsWith("Withdraw\t")) break;

        if (/^[^\t,\n]+,\s*[^,\n]+,\s*.+$/.test(lines[j].trim())) {
          rekening = lines[j].trim();
          break;
        }
      }

      if (userID && rekening) {
        const bagian = rekening.split(",");
        const nama = bagian.slice(2).join(",").trim();

        if (nama) {
          hasil.push(nama + "\t" + userID);
        }
      }
    }
  }

  salin(hasil.join("\n"), "Data Excel berhasil disalin!");
}

function copyNominal() {
  const transaksi = bacaData();

  const hasil = transaksi
    .filter(x => Number.isFinite(x.nominal))
    .map(x => formatAngka(x.nominal + tambahanNominal));

  salin(
    hasil.join("\n"),
    "Nominal berhasil disalin!"
  );
}

async function salin(teks, pesan) {

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(teks);
    } else {
      const area = document.createElement("textarea");
      area.value = teks;
      document.body.appendChild(area);
      area.select();
      const berhasil = document.execCommand("copy");
      area.remove();

      if (!berhasil) throw new Error("Copy gagal");
    }

    statusBox.textContent = pesan;

  } catch (error) {
    statusBox.textContent = "Gagal menyalin. Coba gunakan browser Chrome.";
  }
}

function resetData() {
  if (confirm("Yakin ingin menghapus semua data dan tambahan nominal?")) {
    input.value = "";
    tambahanNominal = 0;
    statusBox.textContent = "Data dan tambahan nominal berhasil direset.";
  }
}

  document.getElementById("toggle2500")
.addEventListener("change", function() {
  tambahan2500 = this.checked;
});

document.getElementById("toggle6500")
.addEventListener("change", function() {
  tambahan6500 = this.checked;
});
  
</script>

</body>
</html>
